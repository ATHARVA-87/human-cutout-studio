# Alembic = database migrations: versioned scripts that change the schema step by step
# (like Git commits for the database). The app runs `upgrade head` automatically at startup;
# see backend/app/db/session.py. Manual use:  alembic upgrade head | alembic history | alembic downgrade -1
[alembic]
script_location = backend/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
