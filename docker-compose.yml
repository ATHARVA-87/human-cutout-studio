# Local stack: `docker compose up --build`, then open http://localhost:8000
# Development (hot reload) uses only the database: `docker compose up db -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: segmentation
      POSTGRES_USER: segmentation
      POSTGRES_PASSWORD: segmentation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segmentation -d segmentation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # reachable from this computer only, not from the network

  app:
    build:
      context: .
      args:
        MODEL_URL: ${MODEL_URL:-} # only used when backend/weights/model.pth does not exist
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEGMENTATION_DATABASE_URL: postgresql+psycopg://segmentation:segmentation@db:5432/segmentation
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
