services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: segmentation
      POSTGRES_USER: segmentation
      POSTGRES_PASSWORD: segmentation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U segmentation -d segmentation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEGMENTATION_DATABASE_URL: postgresql+psycopg://segmentation:segmentation@db:5432/segmentation
      SEGMENTATION_CHECKPOINT_PATH: /app/backend/weights/model.pth
      SEGMENTATION_STORAGE_DIR: /app/uploads
      SEGMENTATION_RATE_LIMIT_SALT: ${SEGMENTATION_RATE_LIMIT_SALT:?set this in .env}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/backend/weights:ro
      - uploads_data:/app/uploads
    # Requires NVIDIA Container Toolkit. Remove this section for CPU inference.
    gpus: all

volumes:
  postgres_data:
  uploads_data:
