# Render Blueprint: the production setup written as code (Render's equivalent of a small Terraform file).
# Render reads this file, builds the Dockerfile, and runs it on the free plan (0.1 CPU, 512 MB RAM).
services:
  - type: web
    name: human-cutout
    runtime: docker
    plan: free
    region: singapore # keep the Neon database in the same region (AWS ap-southeast-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy a new commit on main only after GitHub Actions CI passes
    envVars:
      - key: SEGMENTATION_DATABASE_URL
        sync: false # secret: Render asks for the Neon connection string when the Blueprint is created
      - key: SEGMENTATION_COOKIE_SECURE
        value: "true" # the site is HTTPS, so the session cookie is HTTPS-only
      - key: SEGMENTATION_IP_HASH_SALT
        generateValue: true # Render creates a random secret once; used to hash client IPs
      - key: FORWARDED_ALLOW_IPS
        value: "*" # all traffic reaches the app through Render's proxy, so trust its X-Forwarded-For
      - key: SEGMENTATION_EMAIL_BACKEND
        value: brevo # HTTPS API: Render's free plan blocks SMTP ports
      - key: SEGMENTATION_BREVO_API_KEY
        sync: false # secret: paste your Brevo API key when creating the Blueprint
      - key: SEGMENTATION_EMAIL_FROM
        sync: false # the sender address you verified in Brevo
      # Email links use RENDER_EXTERNAL_URL (set by Render automatically) as the site address.
      - key: MODEL_URL
        value: https://huggingface.co/SUPER-87/human-cutout-unet/resolve/main/model.onnx
