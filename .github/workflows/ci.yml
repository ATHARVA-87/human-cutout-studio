# Continuous integration: every push and pull request runs the backend tests (with a real
# PostgreSQL) and type-checks + builds the frontend. Render deploys main only when this passes.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres: # a throwaway PostgreSQL just for the tests
        image: postgres:16-alpine
        env:
          POSTGRES_DB: segmentation_test
          POSTGRES_USER: segmentation
          POSTGRES_PASSWORD: segmentation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U segmentation" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://segmentation:segmentation@localhost:5432/segmentation_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install CPU PyTorch and the locked dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
