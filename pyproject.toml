[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-segmentation-platform"
version = "0.1.0"
description = "Reproducible training pipeline for binary human segmentation"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115",
  "email-validator>=2.2",
  "numpy>=1.26",
  "Pillow>=10.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "SQLAlchemy>=2.0",
  "torch>=2.4",
  "tqdm>=4.66",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
