[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-cutout"
version = "1.0.0"
description = "U-Net person segmentation trained from scratch, served by a FastAPI + PostgreSQL + React web app"
requires-python = ">=3.10,<3.15"
# What the web server needs. No PyTorch: the server runs the exported model.onnx with ONNX Runtime.
dependencies = [
  "fastapi>=0.115",
  "email-validator>=2.2",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "Pillow>=10.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "SQLAlchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Training, evaluation and ONNX export (scripts/train.py, evaluate_test_split.py, export_onnx.py).
train = ["torch>=2.4", "tqdm>=4.66", "onnx>=1.17"]
dev = ["httpx>=0.27", "pytest>=8.0", "torch>=2.4", "tqdm>=4.66", "onnx>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
