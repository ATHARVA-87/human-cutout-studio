[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-cutout"
version = "1.0.0"
description = "U-Net person segmentation trained from scratch, served by a FastAPI + PostgreSQL + React web app"
requires-python = ">=3.11,<3.15"
# What the web server needs. No PyTorch: the server runs the exported model.onnx with ONNX Runtime.
dependencies = [
  "fastapi>=0.115",
  "email-validator>=2.2",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "Pillow>=10.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Training, evaluation and ONNX export (scripts/train.py, evaluate_test_split.py, export_onnx.py).
train = ["torch>=2.5", "tqdm>=4.66", "onnx>=1.17"]
# Model comparison (scripts/train_pretrained_baseline.py, scripts/benchmark_models.py). Not needed by the app.
benchmark = ["torch>=2.5", "torchvision>=0.20", "tqdm>=4.66", "onnx>=1.17", "scipy>=1.11", "segmentation-models-pytorch>=0.5", "transformers>=4.45"]
# Tests and code checks. PyTorch is installed separately (CPU build in CI; your own build locally).
dev = ["httpx>=0.27", "pytest>=8.0", "tqdm>=4.66", "onnx>=1.17", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

# Linter + formatter (run: ruff check . && ruff format .)
[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
# E/W style, F real bugs (unused/undefined names), I import order, B likely bugs, UP modern syntax
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's `param = Depends(...)` default arguments are intended

[tool.ruff.lint.per-file-ignores]
# These deliberately set sys.path / environment variables before importing the app.
"scripts/*.py" = ["E402"]
"tests/test_api.py" = ["E402"]

# Static type checker (run: mypy)
[tool.mypy]
python_version = "3.11"
files = ["backend", "src", "scripts"]
mypy_path = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
